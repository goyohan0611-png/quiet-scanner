name: Windows scanner checks
on:
  push:
    branches: [main, codex/windows-isolation-1168]
    paths: ['src-tauri/**', 'electron/renderer/**', 'scripts/test_tauri*', 'scripts/test_scanner_scope.cjs', 'package*.json', '.github/workflows/windows.yml']
  pull_request:
    paths: ['src-tauri/**', 'electron/renderer/**', 'scripts/test_tauri*', 'scripts/test_scanner_scope.cjs', 'package*.json', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install build tools
        run: npm ci
      - name: Windows native regression tests and code checks
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test_tauri_bridge.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test_scanner_scope.cjs
          exit $LASTEXITCODE
