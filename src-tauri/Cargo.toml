[package]
name = "quiet-scanner"
version = "4.0.1"
description = "Local network scanner and IP conflict tool"
authors = ["Goyohan"]
edition = "2021"
license = "GPL-2.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
flate2 = "1"
rand = "0.8"
chrono = "0.4"
clipboard-win = "5"
socket2 = "0.6"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock",
  "Win32_UI_Shell", "Win32_System_SystemInformation", "Win32_System_IO"
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "unwind"
