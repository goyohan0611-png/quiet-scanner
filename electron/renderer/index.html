<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiet Scanner</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="control-panel">
        <div class="field interface-field">
          <label>네트워크 인터페이스</label>
          <div class="interface-control">
            <button id="ifaceBtn" class="iface-btn" disabled>네트워크 인터페이스 불러오는 중…</button>
            <button id="refreshInterfaces" class="ghost-btn" title="인터페이스 새로고침">↻ 새로고침</button>
          </div>
        </div>
        <div class="field target-field"><label for="target">스캔할 대역</label><input id="target" placeholder="192.168.0.1-254" /></div>
        <div class="toolbar-actions"><button id="scanBtn" class="primary">대역 스캔</button></div>
      </section>
      <section class="workbar">
        <div><strong id="titleCount">대기 중</strong><span id="subTitle">인터페이스를 선택하고 스캔을 시작하십시오.</span></div>
        <input id="filterInput" class="filter-input" placeholder="검색 — IP · MAC · 제조사" />
        <button id="bookBtn" class="ghost-btn">장비 사전</button>
      </section>
      <section class="table-shell">
        <div class="table-head" id="tableHead"></div>
        <div id="deviceList" class="device-list"><div class="empty">아직 발견된 장비가 없습니다.</div></div>
      </section>
      <div id="logResizeHandle" class="log-resize-handle" title="드래그하여 로그 창 크기 조절"></div>
      <section class="activity-panel">
        <div id="scanProgress" class="log-progress" hidden><span id="scanProgressText">0%</span><i><b id="scanProgressBar"></b></i></div>
        <div class="log-head"><strong>작업 로그</strong><span id="notice">준비됨</span></div>
        <div id="logEntries" class="log-entries"><div class="log-empty">작업 기록이 여기에 표시됩니다.</div></div>
      </section>
    </main>

    <div id="ifaceMenu" class="context-menu iface-menu" hidden></div>
    <div id="contextMenu" class="context-menu" hidden>
      <button data-menu="isolate">이 장비만 분리</button>
      <button data-menu="release">분리 해제</button>
      <span></span>
      <button data-menu="copyMac">MAC 주소 복사</button>
      <button data-menu="book">MAC 앞자리 등록…</button>
    </div>
    <div id="isolateDialog" class="modal" hidden>
      <div class="modal-card">
        <header><strong>장비 분리 확인</strong><button id="isolateClose" title="닫기">×</button></header>
        <p class="modal-hint" id="isolateTarget"></p>
        <p class="modal-caution">이 컴퓨터에서는 이 IP를 선택한 MAC 주소에만 연결합니다. 충돌 장비를 확인한 뒤 반드시 분리 해제를 누르십시오.</p>
        <footer><span class="spacer"></span><button id="isolateCancel" class="ghost">취소</button><button id="isolateConfirm" class="primary danger">이 장비만 분리</button></footer>
      </div>
    </div>
    <div id="bookDialog" class="modal" hidden>
      <div class="modal-card modal-card--wide">
        <header><strong>장비 사전</strong><button id="bookClose" title="닫기">×</button></header>
        <p class="modal-hint">MAC 앞자리로 제조사와 장비 종류를 등록합니다. 70-B3-D5-21처럼 4바이트도 등록할 수 있고, 전체 MAC은 한 장비에만 적용됩니다.</p>
        <form id="bookForm">
          <div class="modal-grid">
            <label>MAC 앞자리<input id="bookPrefix" placeholder="70-B3-D5-21" maxlength="23" required /></label>
            <label>제조사<input id="bookVendor" maxlength="100" /></label>
            <label>장비 종류<input id="bookKind" placeholder="녹화기" maxlength="100" /></label>
            <label>메모<input id="bookNote" maxlength="300" /></label>
          </div>
          <p id="bookMessage" class="modal-hint" role="status"></p>
          <footer><button id="bookDelete" type="button" class="ghost">등록 삭제</button><button id="bookNew" type="button" class="ghost">새로 등록</button><span class="spacer"></span><button id="bookSave" type="submit" class="primary">저장</button></footer>
        </form>
        <input id="bookSearch" class="filter-input" placeholder="사전 검색 — MAC · 제조사 · 종류" />
        <div id="bookList" class="simple-book-list"></div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
